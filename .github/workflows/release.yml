name: Release

on:
  push:
    tags:
      - "myvu-v*-r*"
  workflow_dispatch:
    inputs:
      upstream_version:
        description: "Pinned Hy4ri version (e.g. 1.23.1)"
        required: true
      upstream_code:
        description: "Numeric upstream version code (e.g. 1231)"
        required: true
      personal_revision:
        description: "Personal revision, 1-99"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  # ── Build release APK ─────────────────────────────────────────────────
  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTED_KEY }}

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Determine personal version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            UPSTREAM_VERSION="${{ github.event.inputs.upstream_version }}"
            UPSTREAM_CODE="${{ github.event.inputs.upstream_code }}"
            PERSONAL_REVISION="${{ github.event.inputs.personal_revision }}"
          else
            TAG="${GITHUB_REF#refs/tags/myvu-v}"
            UPSTREAM_VERSION="${TAG%-r*}"
            PERSONAL_REVISION="${TAG##*-r}"
            UPSTREAM_CODE="${UPSTREAM_VERSION//./}"
          fi
          [[ "$PERSONAL_REVISION" =~ ^[1-9][0-9]?$ ]] || { echo "Invalid personal revision"; exit 1; }
          VERSION_NAME="${UPSTREAM_VERSION}-myvu.${PERSONAL_REVISION}"
          VERSION_CODE=$((10#$UPSTREAM_CODE * 100 + 10#$PERSONAL_REVISION))
          echo "upstream_version=$UPSTREAM_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "upstream_code=$UPSTREAM_CODE" >> "$GITHUB_OUTPUT"
          echo "personal_revision=$PERSONAL_REVISION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Release: version=$VERSION_NAME code=$VERSION_CODE"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > hermes-mobile-release.keystore.jks
          ls -lh hermes-mobile-release.keystore.jks

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/hermes-mobile-release.keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PupstreamVersionName="${{ steps.version.outputs.upstream_version }}" \
            -PupstreamVersionCode="${{ steps.version.outputs.upstream_code }}" \
            -PpersonalRevision="${{ steps.version.outputs.personal_revision }}"

      - name: Rename APK and generate version file
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk \
            release/hermes-mobile-${{ steps.version.outputs.version_name }}.apk
          cat > release/version.txt <<EOF
          versionName=${{ steps.version.outputs.version_name }}
          versionCode=${{ steps.version.outputs.version_code }}
          upstreamBase=59bcbdfe3c1bbc1ae2432a09303e78944a0bcbe5
          EOF
          ls -lh release/

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: hermes-mobile-release
          path: release/*.apk
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: myvu-v${{ steps.version.outputs.upstream_version }}-r${{ steps.version.outputs.personal_revision }}
          name: Hermes Mobile ${{ steps.version.outputs.version_name }}
          generate_release_notes: true
          files: |
            release/hermes-mobile-${{ steps.version.outputs.version_name }}.apk
            release/version.txt
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
